name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (works with unzipped files OR a project zip in the repo)
        shell: bash
        run: |
          set -e
          if [ ! -f project.godot ]; then
            Z=$(find . -maxdepth 2 -iname '*project*.zip' -not -path './.git/*' | head -n1)
            if [ -n "$Z" ]; then
              echo "Unzipping $Z"
              mkdir -p _proj
              unzip -q -o "$Z" -d _proj
            fi
          fi
          PG=$(find . -name project.godot -not -path './.git/*' | head -n1)
          if [ -z "$PG" ]; then echo "project.godot not found"; exit 1; fi
          P=$(dirname "$PG")
          echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"
          echo "Project directory: $P"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components (Godot 4.3 requirements)
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" -O godot.zip
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" -O templates.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          TDIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TDIR"
          unzip -q templates.zip -d tpl
          mv tpl/templates/* "$TDIR/"
          godot --version

      - name: Configure Godot (Android SDK, JDK, debug keystore)
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' "$HOME/.config/godot/editor_settings-4.3.tres"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Static project validation (no Godot needed)
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: python3 tools/validate_project.py

      - name: Import resources
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          godot --headless --import || true
          godot --headless --import || true

      - name: Godot data/script tests (non-blocking)
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: godot --headless -s res://tests/run_tests.gd

      - name: Export debug-signed APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -e
          mkdir -p build
          godot --headless --export-debug "Android" build/Swordigo_Dark_Dimension.apk
          ls -la build

      - name: Verify the APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          APK=build/Swordigo_Dark_Dimension.apk
          test -s "$APK"
          SIZE=$(stat -c%s "$APK"); echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 5000000
          unzip -l "$APK" | grep -q AndroidManifest.xml
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK/build-tools/34.0.0/apksigner" verify --verbose "$APK" | head -n 5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swordigo_Dark_Dimension_APK
          path: ${{ env.PROJECT_DIR }}/build/Swordigo_Dark_Dimension.apk
          if-no-files-found: error

      - name: Publish direct-download release (easiest on a phone)
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" build/Swordigo_Dark_Dimension.apk \
            --repo "${{ github.repository }}" \
            --title "Swordigo Dark Dimension - APK #${{ github.run_number }}" \
            --notes "Debug-signed APK built by GitHub Actions (Godot 4.3)."
